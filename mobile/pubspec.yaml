name: dakar_autotrack
description: Dakar AutoTrack - application mobile (agents de parc, portail, clients).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
  qr_flutter: ^4.1.0
  speech_to_text: ^7.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
