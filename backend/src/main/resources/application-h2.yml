# =====================================================================
# Profil « h2 » : base en mémoire, recréée à chaque démarrage.
# Démo sans PostgreSQL (demarrer-h2.cmd) et tests automatiques (mvn test).
# Console : http://localhost:8080/h2-console  (JDBC jdbc:h2:mem:autotrack, utilisateur sa)
# =====================================================================

spring:
  datasource:
    url: jdbc:h2:mem:autotrack;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true
      path: /h2-console
